[package]
name = "wlx-common"
version = "0.1.0"
edition = "2024"
description = "WayVR common library"
license = "GPL-3.0-only"
authors = ["galister", "oo8dev"]
repository = "https://github.com/wlx-team/wayvr"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
derive_more.workspace = true
glam.workspace = true
idmap = { workspace = true, features = ["serde"] }
idmap-derive.workspace = true
libc.workspace = true
log.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
serde_json5.workspace = true
slotmap.workspace = true
smol.workspace = true
strum.workspace = true
xdg.workspace = true

wayvr-ipc = { path = "../wayvr-ipc", default-features = false }

freedesktop-desktop-entry = "0.8.4"
glob = "0.3.3"
identicons-svg = "0.1.0"
inotify = { version = "0.11.5", default-features = false }
rodio = { version = "0.22.2", default-features = false, features = ["hound", "mp3", "playback", "recording"] }
walkdir = "2.5.0"
wgui = { path = "../wgui/" }
