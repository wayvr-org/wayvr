[package]
name = "wgui"
version = "0.1.0"
edition = "2024"
description = "A VR-first Vulkan GUI library"
license = "GPL-3.0-only"
authors = ["galister", "oo8dev"]
repository = "https://github.com/wlx-team/wayvr"

[dependencies]
anyhow.workspace = true
bytes = { workspace = true, optional = true }
glam.workspace = true
log.workspace = true
regex.workspace = true
rust-embed.workspace = true
serde_json.workspace = true
slotmap.workspace = true
smallvec.workspace = true
strum.workspace = true
ash = { version = "0.38", features = ["loaded"] }
raw-window-handle = "0.6"

cosmic-text = "0.19.0"
etagere = "0.3.0"
flate2 = "1.1.9"
image = {
  version = "0.25.10",
  default-features = false,
  features = [
    "gif",
    "jpeg",
    "png",
    "rayon",
    "webp",
  ]
}
lru = "0.18.1"
ouroboros = "0.18.5"
parking_lot = "0.12.5"
resvg = { version = "0.47.0", default-features = false }
roxmltree = "0.21.1"
rustc-hash = "2.1.3"
taffy = "0.12.1"

# `video` wgui feature
dav1d-sys = { version = "0.8.3", optional = true }

[features]
default = ["video"]
video = ["dep:bytes", "dep:dav1d-sys"]

[build-dependencies]
shaderc = "0.8"
