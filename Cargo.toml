[workspace]
resolver = "3"
members = [
  "dash-frontend",
  "scripts/prost_build",
  "uidev",
  "wayvr",
  "wayvr-ipc",
  "wayvrctl",
  "wgui",
  "wlx-capture",
  "wlx-common",
]

[workspace.dependencies]
anyhow = "1.0.100"
async-channel = "2.3"
async-io = "2.1"
bytes = { version = "1.11.1" }
chrono = "0.4.42"
clap = { version = "4.5.53", features = ["derive"] }
dbus = { version = "0.9.12" }
glam = { version = "0.30.9", features = ["mint", "serde"] }
idmap = "0.2.2"
idmap-derive = "0.2.22"
interprocess = { version = "2.2.3" }
libc = "0.2.178"
log = "0.4.29"
pipewire = { version = "0.10", features = ["v0_3_33", "v0_3_65"] }
regex = "1.12.2"
rust-embed = "8.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.145"
serde_json5 = "0.2.1"
slotmap = "1.1.1"
smallvec = "1.15.2"
smol = "2.0.2"
strum = { version = "0.27.2", features = ["derive"] }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
uuid = { version = "1.19.0", features = ["fast-rng", "serde", "v4"] }
vulkano = {
  version = "0.35.2",
  default-features = false,
  features = [
    "macros",
  ]
}
vulkano-shaders = "0.35.0"
wayland-client = { version = "0.31" }
wayland-protocols = { version = "0.32" }
wayland-protocols-misc = { version = "0.3.12" }
winit = "0.30.12"
xdg = "3.0.0"

[patch.crates-io]
vulkano = {
  git = "https://github.com/galister/vulkano.git",
  rev = "cf7f92867928a56ce16b376037c1120f2b167678"
}

[profile.dev]
opt-level = 1
debug = true
strip = "none"
debug-assertions = true
incremental = true

# to be used in case if you don't want debug features
# (faster incremental compilation, about 15x smaller binary size compared to dev)
# --profile=plain
[profile.plain]
inherits = "dev"
opt-level = 1
debug = false
strip = true
debug-assertions = true
incremental = true

[profile.release-with-debug]
inherits = "release"
debug = true
